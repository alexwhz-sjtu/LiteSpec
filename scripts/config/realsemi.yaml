algorithm: realsemi
launcher:
  target_model: /data/temp/artifacts/models/Qwen3-4B
  output_dir: ./outputs/realsemi_qwen3_4b
  nnodes: 1
  node_rank: 0
  nproc_per_node: 8
  master_addr: 127.0.0.1
  master_port: 29501
  train_data: /path/to/train.jsonl
arguments:
  target_model_backend: sglang
  sglang_attention_backend: fa3
  sglang_mem_fraction_static: 0.3
  sglang_ep_size: 1
  attention_backend: flex_attention
  flex_attention_backend: TRITON
  chat_template: qwen
  max_length: 4096
  batch_size: 1
  accumulation_steps: 1
  tp_size: 1
  shard_draft_by_tp: false
  dist_timeout: 1200
  block_size: 8
  num_draft_layers: 5
  target_layer_ids: 0,8,16,24,31
  num_anchors: 512
  attention_mode: gqa
  num_epochs: 6
  learning_rate: 0.0006
  weight_decay: 0.0
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  use_muon: true
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_weight_decay: 0.1
  muon_matrices_per_rank: 1
  muon_adamw_lr: 0.0004
  muon_adamw_weight_decay: 0.1
  seed: 42
  objective_chunk_blocks: 512
  cache_dir: ./cache/train
  build_dataset_num_proc: 32
  dataloader_num_workers: 8
  log_interval: 50
  save_interval: 10000
  report_to: wandb
  wandb_project: spec-decoding
  wandb_name: realsemi
  disaggregate: false
  target_ranks_per_node: 4
  draft_ranks_per_node: 4
  target_tp_size: 1
  node_batch_size: 4
  draft_micro_batch_size: 1
  pipeline_depth: 2
  profile: false
  num_parallel_layers: 4
  serial_context_mode: full
  ce_loss_alpha: 0.1
  l1_loss_alpha: 0.9
