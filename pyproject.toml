[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litespec"
dynamic = ["version"]
description = "Training and evaluation toolkit for DLite and DFlash-family speculative decoding."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "accelerate",
    "causal-conv1d==1.7.0",
    "datasets",
    "flash-linear-attention[conv1d]==0.5.2",
    "huggingface-hub",
    "loguru",
    "ninja",
    "numpy",
    "openai-harmony",
    "packaging",
    "psutil",
    "pydantic",
    "PyYAML>=6.0",
    "qwen-vl-utils==0.0.11",
    "rich",
    "safetensors",
    "sglang==0.5.9",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.1",
    "tqdm",
    "typing-extensions",
    "wandb",
    "yunchang",
]

[project.urls]
Repository = "https://github.com/alexwhz-sjtu/LiteSpec"
Issues = "https://github.com/alexwhz-sjtu/LiteSpec/issues"

[project.optional-dependencies]
fa = ["flash-attn"]

[dependency-groups]
dev = [
    "build",
    "pre-commit",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["litespec*"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.uv]
preview = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.extra-build-dependencies]
# This CUDA extension must use the exact PyTorch C++ ABI selected by the lock.
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
